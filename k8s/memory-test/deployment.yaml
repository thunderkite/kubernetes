apiVersion: v1
kind: Namespace
metadata:
  name: memory-test

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: memory-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mem-py
  template:
    metadata:
      labels:
        app: mem-py
    spec:
      containers:
      - name: server
        image: khanasis/memory-test:0.0.1
        resources:
          requests:
            cpu: 1000m
            memory: 2000Mi
          limits:
            cpu: 1000m
            memory: 2000Mi


