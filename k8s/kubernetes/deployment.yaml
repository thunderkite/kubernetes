apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
      - name: server
        image: khanasis/fask-app:0.0.1
        ports:
        - name: web
          containerPort: 8080