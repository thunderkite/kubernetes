apiVersion: v1
kind: Namespace
metadata:
  name: prob

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-server
  namespace: prob
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-server
  template:
    metadata:
      labels:
        app: flask-server
    spec:
      containers:
      - name: flask-server
        image: khanasis/fask-app:0.0.2
        resources:
          requests:
            cpu: 1000m
            memory: 2000Mi
          limits:
            cpu: 1000m
            memory: 2000Mi        
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: flask-server
  namespace: prob
spec:
  selector:
    app: flask-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
